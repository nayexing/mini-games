<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#faf8ef">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%238fa391'/%3E%3Crect x='8' y='8' width='22' height='22' rx='4' fill='%23f6f3ea'/%3E%3Crect x='34' y='8' width='22' height='22' rx='4' fill='%23dfe6dc'/%3E%3Crect x='8' y='34' width='22' height='22' rx='4' fill='%23dfe6dc'/%3E%3Crect x='34' y='34' width='22' height='22' rx='4' fill='%23f6f3ea'/%3E%3Ctext x='19' y='25' font-family='Arial' font-size='15' font-weight='700' text-anchor='middle' fill='%234a7fb0'%3E1%3C/text%3E%3Cpath d='M42 14v12' stroke='%23594330' stroke-width='2'/%3E%3Cpath d='M43 14l7 3.5-7 3.5z' fill='%23d9534f'/%3E%3Ccircle cx='19' cy='45' r='5' fill='%23594330'/%3E%3C/svg%3E">
  <title>扫雷 · 小游戏合集</title>
  <link rel="stylesheet" href="../css/common.css?v=1.3.0">
  <link rel="stylesheet" href="../css/minesweeper.css?v=1.3.0">
</head>
<body data-game="minesweeper">
  <div class="container">
    <header class="header">
      <h1 class="title">扫雷</h1>
      <div class="stats">
        <div class="stat-card stat-card--primary">
          <span class="stat-label">剩余雷数</span>
          <span class="stat-value" id="mines-left">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">用时</span>
          <span class="stat-value" id="time">00:00</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">最佳</span>
          <span class="stat-value" id="best">—</span>
        </div>
      </div>
    </header>

    <div class="controls">
      <button type="button" id="btn-new" class="btn btn-primary">新游戏</button>
      <button type="button" id="btn-home" class="btn btn-secondary">主页</button>
      <button type="button" id="btn-undo" class="btn btn-secondary">撤销</button>
      <button type="button" id="btn-settings" class="btn btn-secondary">设置</button>
    </div>

    <div class="mode-switch" id="mode-switch" role="group" aria-label="点按操作">
      <button type="button" data-mode="reveal" class="active" aria-pressed="true">
        <span class="mode-icon mode-icon--reveal" aria-hidden="true"></span>翻开
      </button>
      <button type="button" data-mode="flag" aria-pressed="false">
        <span class="mode-icon mode-icon--flag" aria-hidden="true"></span>插旗
      </button>
    </div>

    <div class="board-wrap ms-wrap">
      <div class="ms-scroll" id="ms-scroll">
        <div class="ms-board" id="ms-board" role="grid" aria-label="扫雷棋盘"></div>
      </div>
    </div>

    <p class="hint" id="hint">点按翻开格子，长按插旗；点已翻开的数字可快速翻开周围</p>
  </div>

  <!-- 结果：胜利 / 踩雷 -->
  <div class="modal-backdrop" id="result-modal">
    <div class="modal-card overlay-card">
      <div class="overlay-title" id="result-title">扫雷成功！</div>
      <div class="win-record" id="result-record">新纪录</div>
      <p class="result-note" id="result-note"></p>
      <div class="win-stats" id="result-stats">
        <div class="win-stat">
          <span>难度</span>
          <span class="win-stat-value" id="result-level">初级</span>
        </div>
        <div class="win-stat">
          <span>用时</span>
          <span class="win-stat-value" id="result-time">00:00</span>
        </div>
        <div class="win-stat">
          <span>最佳成绩</span>
          <span class="win-stat-value" id="result-best">—</span>
        </div>
      </div>
      <div class="overlay-buttons">
        <button type="button" id="btn-result-undo" class="btn btn-secondary">撤销一步</button>
        <button type="button" id="btn-result-retry" class="btn btn-primary">再来一局</button>
      </div>
    </div>
  </div>

  <!-- 设置 -->
  <div class="modal-backdrop" id="settings-modal">
    <div class="modal-card settings-card">
      <h2 class="modal-title">设置</h2>

      <div class="setting-group" data-setting="longPress">
        <div class="setting-label">长按插旗时长</div>
        <div class="setting-options">
          <button type="button" data-value="short">短</button>
          <button type="button" data-value="standard">标准</button>
          <button type="button" data-value="long">长</button>
        </div>
      </div>

      <div class="setting-group" data-setting="chordTap">
        <div class="setting-label">点数字快速翻开</div>
        <div class="setting-options">
          <button type="button" data-value="on">开启</button>
          <button type="button" data-value="off">关闭</button>
        </div>
      </div>

      <button type="button" id="btn-settings-close" class="btn btn-primary modal-close">完成</button>
    </div>
  </div>

  <!-- 开始页：选择难度 -->
  <div class="start-screen" id="start-screen">
    <div class="start-inner">
      <div class="ms-logo" aria-hidden="true">
        <span class="open n1">1</span><span class="open"></span><span class="open n1">1</span>
        <span class="open n2">2</span><span class="flag"></span><span class="closed"></span>
        <span class="closed"></span><span class="closed"></span><span class="closed"></span>
      </div>
      <h1 class="start-title">扫雷</h1>
      <p class="start-subtitle">选择难度，每局随机布雷，第一下必定安全</p>
      <div class="start-size-grid" id="start-level-grid">
        <button type="button" data-level="beginner"><span class="size-num">初级</span><span class="size-label">9×9 · 10 雷</span></button>
        <button type="button" data-level="intermediate"><span class="size-num">中级</span><span class="size-label">16×16 · 40 雷</span></button>
        <button type="button" data-level="expert"><span class="size-num">高级</span><span class="size-label">16×30 · 99 雷</span></button>
      </div>
      <button type="button" id="btn-start" class="btn btn-primary start-btn">开始游戏</button>
      <button type="button" id="btn-start-home" class="btn btn-secondary start-back">返回菜单</button>
    </div>
  </div>

  <script src="../js/common/storage.js?v=1.3.0"></script>
  <script src="../js/common/modal.js?v=1.3.0"></script>
  <script src="../js/common/motion.js?v=1.3.0"></script>
  <script src="../js/common/prefs.js?v=1.3.0"></script>
  <script src="../js/common/haptics.js?v=1.3.0"></script>
  <script src="../js/common/shell.js?v=1.3.0"></script>
  <script src="../js/minesweeper.js?v=1.3.0"></script>
  <script src="../js/minesweeper-main.js?v=1.3.0"></script>
</body>
</html>
